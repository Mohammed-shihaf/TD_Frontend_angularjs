apiVersion: apps/v1
kind: Deployment
metadata:
  name: td-frontend-angularjs
  labels:
    app: td-frontend-angularjs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: td-frontend-angularjs
  template:
    metadata:
      labels:
        app: td-frontend-angularjs
    spec:
      containers:
        - name: app
          image: td-frontend-angularjs:16
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: td-frontend-angularjs
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: td-frontend-angularjs
